name: Generate Release Notes

on:
  pull_request:
    types: [closed]
    branches:
      - staging

jobs:
  release-notes:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Get PR approver
        id: approver
        run: |
          APPROVER=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            | jq -r '.[] | select(.state=="APPROVED") | .user.login' | head -n 1)

          echo "approver=$APPROVER" >> $GITHUB_OUTPUT

      - name: Send PR data to release API
        run: |
          payload=$(jq -n \
            --arg prNumber "${{ github.event.pull_request.number }}" \
            --arg prTitle "${{ github.event.pull_request.title }}" \
            --arg mergedBy "${{ github.actor }}" \
            --arg approvedBy "${{ steps.approver.outputs.approver }}" \
            --arg mergedAt "${{ github.event.pull_request.merged_at }}" \
            --arg prBody "${{ github.event.pull_request.body }}" \
            '{
              prNumber: ($prNumber | tonumber),
              prTitle: $prTitle,
              mergedBy: $mergedBy,
              approvedBy: $approvedBy,
              mergedAt: $mergedAt,
              prBody: $prBody,
              initial: false
            }')

          curl -X POST https://docs.meradhan.co/api/generate-release-notes \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer 4909e9a3e59032855ce0dd0b68e511e73eeffcda8eac6b4d134c7bca68209f3b" \
            -d "$payload"
