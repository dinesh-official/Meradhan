name: stage be deploy

on:
  push:
    branches:
      - stage-test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from GitHub Variables & Secrets
        shell: bash
        env:

          # 🔐 Secrets
          DEV_STRAPI_API_TOKEN: ${{ secrets.DEV_STRAPI_API_TOKEN }}
          DEV_JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
          DEV_PASSWORD_PEPPER: ${{ secrets.DEV_PASSWORD_PEPPER }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DEV_DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}

          DEV_KRA_PASSWORD: ${{ secrets.DEV_KRA_PASSWORD }}
          DEV_KRA_PASS_KEY: ${{ secrets.DEV_KRA_PASS_KEY }}

          DEV_MSG91_AUTH_KEY: ${{ secrets.DEV_MSG91_AUTH_KEY }}

          DEV_SMTP_PASS: ${{ secrets.SMTP_PASS }}

          DEV_CBRICS_PASSWORD: ${{ secrets.DEV_CBRICS_PASSWORD }}
          DEV_RFQ_CBRICS_PASSWORD: ${{ secrets.DEV_RFQ_CBRICS_PASSWORD }}

          DEV_DIGIO_USERNAME_PASS: ${{ secrets.DEV_DIGIO_USERNAME_PASS }}

          DEV_NSDL_SECRET_KEY: ${{ secrets.DEV_NSDL_SECRET_KEY }}
          DEV_CDSL_AES_KEY: ${{ secrets.DEV_CDSL_AES_KEY }}

          DEV_AUTH_SECRET: ${{ secrets.DEV_AUTH_SECRET }}
          DEV_AUTH_GOOGLE_SECRET: ${{ secrets.DEV_AUTH_GOOGLE_SECRET }}
          DEV_AUTH_FACEBOOK_SECRET: ${{ secrets.DEV_AUTH_FACEBOOK_SECRET }}
          DEV_AUTH_MICROSOFT_ENTRA_ID_SECRET: ${{ secrets.DEV_AUTH_MICROSOFT_ENTRA_ID_SECRET }}

          DEV_RAZORPAY_KEY_SECRET: ${{ secrets.DEV_RAZORPAY_KEY_SECRET }}
          DEV_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.DEV_RAZORPAY_WEBHOOK_SECRET }}

          DEV_S3_ACCESS_KEY_ID: ${{ secrets.DEV_S3_ACCESS_KEY_ID }}
          DEV_S3_SECRET_ACCESS_KEY: ${{ secrets.DEV_S3_SECRET_ACCESS_KEY }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEV_NEXT_PUBLIC_GRAPHQL_KEY: ${{ secrets.DEV_NEXT_PUBLIC_GRAPHQL_KEY }}

          # ⚙️ Vars
          DEV_PORT: ${{ vars.DEV_PORT }}
          DEV_REDIS_HOST: ${{ vars.DEV_REDIS_HOST }}
          DEV_REDIS_PORT: ${{ vars.DEV_REDIS_PORT }}

          DEV_KRA_USERNAME: ${{ vars.DEV_KRA_USERNAME }}
          DEV_KRA_OKRA_CD_MI_ID: ${{ vars.DEV_KRA_OKRA_CD_MI_ID }}
          DEV_KRA_MOB_NO: ${{ vars.DEV_KRA_MOB_NO }}
          DEV_KRA_ENV: ${{ vars.DEV_KRA_ENV }}

          DEV_MSG91_LOGIN_TEMPLATE: ${{ vars.DEV_MSG91_LOGIN_TEMPLATE }}
          DEV_MSG91_SIGNUP_TEMPLATE: ${{ vars.DEV_MSG91_SIGNUP_TEMPLATE }}
          DEV_MSG91_VERIFY_TEMPLATE: ${{ vars.DEV_MSG91_VERIFY_TEMPLATE }}

          DEV_SMTP_SENDER: ${{ vars.SMTP_SENDER }}
          DEV_SMTP_HOST: ${{ vars.SMTP_HOST }}
          DEV_SMTP_PORT: ${{ vars.SMTP_PORT }}
          DEV_SMTP_USER: ${{ vars.SMTP_USER }}

          DEV_CBRICS_DOMAIN: ${{ vars.DEV_CBRICS_DOMAIN }}
          DEV_RFQ_CBRICS_DOMAIN: ${{ vars.DEV_RFQ_CBRICS_DOMAIN }}
          DEV_RFQ_CBRICS_LOGIN: ${{ vars.DEV_RFQ_CBRICS_LOGIN }}

          DEV_NDSL_REQUESTOR_ID: ${{ vars.DEV_NDSL_REQUESTOR_ID }}
          DEV_NSDL_MODE: ${{ vars.DEV_NSDL_MODE }}

          DEV_ENTITY_ID: ${{ vars.DEV_ENTITY_ID }}
          DEV_CDSL_MODE: ${{ vars.DEV_CDSL_MODE }}

          DEV_AUTH_GOOGLE_ID: ${{ vars.DEV_AUTH_GOOGLE_ID }}
          DEV_AUTH_FACEBOOK_ID: ${{ vars.DEV_AUTH_FACEBOOK_ID }}
          DEV_AUTH_MICROSOFT_ENTRA_ID_ID: ${{ vars.DEV_AUTH_MICROSOFT_ENTRA_ID_ID }}
          DEV_AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${{ vars.DEV_AUTH_MICROSOFT_ENTRA_ID_ISSUER }}

          DEV_RAZORPAY_KEY_ID: ${{ vars.DEV_RAZORPAY_KEY_ID }}

          MSG91_RCS_URL: ${{ vars.MSG91_RCS_URL }}

        run: |
          cat <<EOF > .env

          NEXT_PUBLIC_HOST_URL=https://aws.meradhan.co
          NEXT_PUBLIC_BACKEND_IP_URL=http://stage-be.stage:4000

          GRAPHQL_KEY=${DEV_NEXT_PUBLIC_GRAPHQL_KEY}
          STRAPI_API_TOKEN=${DEV_STRAPI_API_TOKEN}

          JWT_SECRET=${DEV_JWT_SECRET}
          PASSWORD_PEPPER=${DEV_PASSWORD_PEPPER}

          DATABASE_URL=${DEV_DATABASE_URL}
          DIRECT_URL=${DEV_DIRECT_URL}

          REDIS_HOST=${DEV_REDIS_HOST}
          REDIS_PORT=${DEV_REDIS_PORT}

          OPENAI_API_KEY=${OPENAI_API_KEY}

          # KRA
          KRA_USERNAME=${DEV_KRA_USERNAME}
          KRA_PASSWORD=${DEV_KRA_PASSWORD}
          KRA_PASS_KEY=${DEV_KRA_PASS_KEY}
          KRA_OKRA_CD_MI_ID=${DEV_KRA_OKRA_CD_MI_ID}
          KRA_MOB_NO=${DEV_KRA_MOB_NO}
          KRA_ENV=${DEV_KRA_ENV}

          # CBRICS (FIXED ENUM)
          CBRICS_DOMAIN=${DEV_CBRICS_DOMAIN}
          CBRICS_PASSWORD=${DEV_CBRICS_PASSWORD}
          CBRICS_ENV=UAT

          RFQ_CBRICS_DOMAIN=${DEV_RFQ_CBRICS_DOMAIN}
          RFQ_CBRICS_LOGIN=${DEV_RFQ_CBRICS_LOGIN}
          RFQ_CBRICS_PASSWORD=${DEV_RFQ_CBRICS_PASSWORD}
          RFQ_CBRICS_ENV=UAT

          # MSG91
          MSG91_AUTH_KEY=${DEV_MSG91_AUTH_KEY}
          MSG91_LOGIN_TEMPLATE=${DEV_MSG91_LOGIN_TEMPLATE}
          MSG91_SIGNUP_TEMPLATE=${DEV_MSG91_SIGNUP_TEMPLATE}
          MSG91_VERIFY_TEMPLATE=${DEV_MSG91_VERIFY_TEMPLATE}
          MSG91_RCS_URL=${MSG91_RCS_URL}

          # SMTP
          SMTP_SENDER=${DEV_SMTP_SENDER}
          SMTP_HOST=${DEV_SMTP_HOST}
          SMTP_PORT=${DEV_SMTP_PORT}
          SMTP_USER=${DEV_SMTP_USER}
          SMTP_PASS=${DEV_SMTP_PASS}

          # DIGIO
          DIGIO_USERNAME_PASS=${DEV_DIGIO_USERNAME_PASS}

          # NSDL/CDSL
          NDSL_REQUESTOR_ID=${DEV_NDSL_REQUESTOR_ID}
          NSDL_SECRET_KEY=${DEV_NSDL_SECRET_KEY}
          NSDL_MODE=${DEV_NSDL_MODE}
          CDSL_AES_KEY=${DEV_CDSL_AES_KEY}
          ENTITY_ID=${DEV_ENTITY_ID}
          CDSL_MODE=${DEV_CDSL_MODE}

          # AUTH
          AUTH_SECRET=${DEV_AUTH_SECRET}
          AUTH_GOOGLE_ID=${DEV_AUTH_GOOGLE_ID}
          AUTH_GOOGLE_SECRET=${DEV_AUTH_GOOGLE_SECRET}
          AUTH_FACEBOOK_ID=${DEV_AUTH_FACEBOOK_ID}
          AUTH_FACEBOOK_SECRET=${DEV_AUTH_FACEBOOK_SECRET}
          AUTH_MICROSOFT_ENTRA_ID_ID=${DEV_AUTH_MICROSOFT_ENTRA_ID_ID}
          AUTH_MICROSOFT_ENTRA_ID_SECRET=${DEV_AUTH_MICROSOFT_ENTRA_ID_SECRET}
          AUTH_MICROSOFT_ENTRA_ID_ISSUER=${DEV_AUTH_MICROSOFT_ENTRA_ID_ISSUER}

          # PAYMENTS
          RAZORPAY_KEY_ID=${DEV_RAZORPAY_KEY_ID}
          RAZORPAY_KEY_SECRET=${DEV_RAZORPAY_KEY_SECRET}
          RAZORPAY_WEBHOOK_SECRET=${DEV_RAZORPAY_WEBHOOK_SECRET}

          # STORAGE
          S3_ACCESS_KEY_ID=${DEV_S3_ACCESS_KEY_ID}
          S3_SECRET_ACCESS_KEY=${DEV_S3_SECRET_ACCESS_KEY}

          EOF

          echo "------ FINAL ENV ------"
          cat .env

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} \
          | docker login --username AWS --password-stdin 450321244603.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Build & Push Docker Image
        run: |
          docker build -f backenddocker -t 450321244603.dkr.ecr.ap-south-1.amazonaws.com/stage-meradhan-be:latest .
          docker push 450321244603.dkr.ecr.ap-south-1.amazonaws.com/stage-meradhan-be:latest

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: stage-meradhan-be-revision.json
          cluster: stage-cluster
          service: meradhan-be
          force-new-deployment: true
