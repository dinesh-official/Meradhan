name: Build, Push & Deploy

on:
  push:
    branches:
      - lokesh/pipeline

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from GitHub Secrets
        shell: bash
        run: |
          {
            echo "NEXT_PUBLIC_HOST_URL='https://aws.meradhan.co'"
            echo "NEXT_PUBLIC_CRM_HOST_URL='https://awscrm.meradhan.co'"
            echo "NEXT_PUBLIC_BACKEND_HOST_URL='https://awsapi.meradhan.co'"
            echo "NEXT_PUBLIC_BACKEND_IP_URL='http://prod-meradhan-be.prod-namespace:4000'"
            echo "NEXT_PUBLIC_STRAPI_HOST_URL='https://spyder.meradhan.co'"
            echo "NEXT_PUBLIC_DIGIO='production'"
            echo "STRAPI_API_URL='https://spyder.meradhan.co/api'"
            echo "PORT='4000'"

            echo "NEXT_PUBLIC_GRAPHQL_KEY='$(printf "%s" "${{ secrets.NEXT_PUBLIC_GRAPHQL_KEY }}" | sed "s/'/\\\\'/g")'"
            echo "STRAPI_API_TOKEN='$(printf "%s" "${{ secrets.STRAPI_API_TOKEN }}" | sed "s/'/\\\\'/g")'"
            echo "JWT_SECRET='$(printf "%s" "${{ secrets.JWT_SECRET }}" | sed "s/'/\\\\'/g")'"

            echo "DATABASE_URL='$(printf "%s" "${{ secrets.DATABASE_URL }}" | sed "s/'/\\\\'/g")'"
            echo "DIRECT_URL='$(printf "%s" "${{ secrets.DIRECT_URL }}" | sed "s/'/\\\\'/g")'"

            echo "REDIS_HOST='$(printf "%s" "${{ secrets.REDIS_HOST }}" | sed "s/'/\\\\'/g")'"
            echo "REDIS_PORT='$(printf "%s" "${{ secrets.REDIS_PORT }}" | sed "s/'/\\\\'/g")'"

            echo "KRA_USERNAME='$(printf "%s" "${{ secrets.KRA_USERNAME }}" | sed "s/'/\\\\'/g")'"
            echo "KRA_PASSWORD='$(printf "%s" "${{ secrets.KRA_PASSWORD }}" | sed "s/'/\\\\'/g")'"
            echo "KRA_PASS_KEY='$(printf "%s" "${{ secrets.KRA_PASS_KEY }}" | sed "s/'/\\\\'/g")'"
            echo "KRA_OKRA_CD_MI_ID='$(printf "%s" "${{ secrets.KRA_OKRA_CD_MI_ID }}" | sed "s/'/\\\\'/g")'"
            echo "KRA_ENV='$(printf "%s" "${{ secrets.KRA_ENV }}" | sed "s/'/\\\\'/g")'"

            echo "MSG91_AUTH_KEY='$(printf "%s" "${{ secrets.MSG91_AUTH_KEY }}" | sed "s/'/\\\\'/g")'"
            echo "MSG91_SIGNUP_TEMPLATE='$(printf "%s" "${{ secrets.MSG91_SIGNUP_TEMPLATE }}" | sed "s/'/\\\\'/g")'"
            echo "MSG91_LOGIN_TEMPLATE='$(printf "%s" "${{ secrets.MSG91_LOGIN_TEMPLATE }}" | sed "s/'/\\\\'/g")'"
            echo "MSG91_VERIFY_TEMPLATE='$(printf "%s" "${{ secrets.MSG91_VERIFY_TEMPLATE }}" | sed "s/'/\\\\'/g")'"

            echo "SMTP_SENDER='$(printf "%s" "${{ secrets.SMTP_SENDER }}" | sed "s/'/\\\\'/g")'"
            echo "SMTP_HOST='${{ secrets.SMTP_HOST }}'"
            echo "SMTP_PORT='${{ secrets.SMTP_PORT }}'"
            echo "SMTP_USER='$(printf "%s" "${{ secrets.SMTP_USER }}" | sed "s/'/\\\\'/g")'"
            echo "SMTP_PASS='$(printf "%s" "${{ secrets.SMTP_PASS }}" | sed "s/'/\\\\'/g")'"

            echo "CBRICS_DOMAIN='${{ secrets.CBRICS_DOMAIN }}'"
            echo "CBRICS_LOGIN='${{ secrets.CBRICS_LOGIN }}'"
            echo "CBRICS_PASSWORD='$(printf "%s" "${{ secrets.CBRICS_PASSWORD }}" | sed "s/'/\\\\'/g")'"

            echo "RFQ_CBRICS_DOMAIN='${{ secrets.RFQ_CBRICS_DOMAIN }}'"
            echo "RFQ_CBRICS_LOGIN='${{ secrets.RFQ_CBRICS_LOGIN }}'"
            echo "RFQ_CBRICS_PASSWORD='$(printf "%s" "${{ secrets.RFQ_CBRICS_PASSWORD }}" | sed "s/'/\\\\'/g")'"

            echo "DIGIO_USERNAME_PASS='$(printf "%s" "${{ secrets.DIGIO_USERNAME_PASS }}" | sed "s/'/\\\\'/g")'"

            echo "NDSL_REQUESTOR_ID='${{ secrets.NDSL_REQUESTOR_ID }}'"
            echo "NSDL_SECRET_KEY='$(printf "%s" "${{ secrets.NSDL_SECRET_KEY }}" | sed "s/'/\\\\'/g")'"

            echo "CDSL_AES_KEY='$(printf "%s" "${{ secrets.CDSL_AES_KEY }}" | sed "s/'/\\\\'/g")'"
            echo "ENTITY_ID='${{ secrets.ENTITY_ID }}'"

            echo "AUTH_SECRET='$(printf "%s" "${{ secrets.AUTH_SECRET }}" | sed "s/'/\\\\'/g")'"
            echo "AUTH_GOOGLE_ID='$(printf "%s" "${{ secrets.AUTH_GOOGLE_ID }}" | sed "s/'/\\\\'/g")'"
            echo "AUTH_GOOGLE_SECRET='$(printf "%s" "${{ secrets.AUTH_GOOGLE_SECRET }}" | sed "s/'/\\\\'/g")'"
            echo "AUTH_FACEBOOK_ID='${{ secrets.AUTH_FACEBOOK_ID }}'"
            echo "AUTH_FACEBOOK_SECRET='$(printf "%s" "${{ secrets.AUTH_FACEBOOK_SECRET }}" | sed "s/'/\\\\'/g")'"
            echo "AUTH_MICROSOFT_ENTRA_ID_ID='${{ secrets.AUTH_MICROSOFT_ENTRA_ID_ID }}'"
            echo "AUTH_MICROSOFT_ENTRA_ID_SECRET='$(printf "%s" "${{ secrets.AUTH_MICROSOFT_ENTRA_ID_SECRET }}" | sed "s/'/\\\\'/g")'"
            echo "AUTH_MICROSOFT_ENTRA_ID_ISSUER='${{ secrets.AUTH_MICROSOFT_ENTRA_ID_ISSUER }}'"

            echo "RAZORPAY_KEY_ID='${{ secrets.RAZORPAY_KEY_ID }}'"
            echo "RAZORPAY_KEY_SECRET='$(printf "%s" "${{ secrets.RAZORPAY_KEY_SECRET }}" | sed "s/'/\\\\'/g")'"
            echo "RAZORPAY_WEBHOOK_SECRET='$(printf "%s" "${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" | sed "s/'/\\\\'/g")'"

            echo "S3_ACCESS_KEY_ID='${{ secrets.S3_ACCESS_KEY_ID }}'"
            echo "S3_SECRET_ACCESS_KEY='$(printf "%s" "${{ secrets.S3_SECRET_ACCESS_KEY }}" | sed "s/'/\\\\'/g")'"
            echo "S3_REGION='${{ secrets.S3_REGION }}'"
            echo "S3_ENDPOINT='${{ secrets.S3_ENDPOINT }}'"
            echo "S3_BUCKET_NAME='${{ secrets.S3_BUCKET_NAME }}'"
          } > .env

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Docker Image
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          REPOSITORY: prod-crm-ui
          IMAGE_TAG: latest
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -f crmdockerfile .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          cluster: prod-cluster
          service: prod-crm-ui
          force-new-deployment: true
